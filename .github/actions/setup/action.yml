name: 'Setup Node & pnpm'
description: 'Set up Node.js and the pinned pnpm version with a store cache, then install dependencies.'

inputs:
  node-version:
    description: 'Node.js version to use. When empty, the version from .nvmrc is used.'
    required: false
    default: ''
  production:
    description: 'Install production dependencies only (--prod)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.nvmrc'
    - name: Use pinned pnpm version
      shell: bash
      run: corepack enable && corepack install
    - name: Cache pnpm store
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.production == 'true' && '--prod' || '' }}
