name: Publish documentation image

on:
    push:
        tags: ['v*.*.*']

permissions:
    contents: read

concurrency:
    group: docs-image-publication
    queue: max
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'stamhoofd/stamhoofd'
        runs-on: ubuntu-latest
        environment: publishing
        env:
            STAMHOOFD_CONTAINER_RUNTIME: docker
            PUPPETEER_SKIP_DOWNLOAD: 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check stable release tag
              id: release
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo 'stable=true' >> "$GITHUB_OUTPUT"
                  fi
            - name: Set up Node and pnpm
              if: steps.release.outputs.stable == 'true'
              uses: ./.github/actions/setup
            - name: Build documentation image
              if: steps.release.outputs.stable == 'true'
              env:
                  TAG: ${{ github.ref_name }}
              run: pnpm stam docs image build "$TAG"
            - name: Publish version and latest
              if: steps.release.outputs.stable == 'true'
              env:
                  TAG: ${{ github.ref_name }}
                  STAM_DOCS_REGISTRY: ${{ vars.STAM_DOCS_REGISTRY }}
                  STAM_DOCS_REGISTRY_USERNAME: ${{ vars.STAM_DOCS_REGISTRY_USERNAME }}
                  STAM_DOCS_REGISTRY_PASSWORD: ${{ secrets.STAM_DOCS_REGISTRY_PASSWORD }}
              run: pnpm stam docs image publish "$TAG" --latest
